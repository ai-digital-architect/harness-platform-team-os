# CI: validate graph + index drift check (T0.4).
# Scripts are stdlib-only Python 3; python:3.12 (full image, not slim) is used
# because the drift check needs git, which the slim variants do not ship.
image: python:3.12

definitions:
  steps:
    - step: &validate
        name: validate graph and index
        script:
          - python3 -m unittest discover scripts/tests
          - python3 scripts/graph_check.py
          - python3 scripts/build_index.py
          - git diff --exit-code knowledge/INDEX.md knowledge/graph.json

pipelines:
  pull-requests:
    '**':
      - step: *validate
  branches:
    main:
      - step: *validate
